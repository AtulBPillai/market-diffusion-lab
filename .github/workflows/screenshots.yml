name: Capture dashboard screenshots

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/screenshots.yml'
      - 'scripts/capture_screenshots.py'

permissions:
  contents: write

concurrency:
  group: dashboard-screenshots
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install application and screenshot dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install playwright==1.51.0
          python -m playwright install --with-deps chromium
      - name: Verify application and capture browser screenshots
        run: |
          python -m pytest -q
          python scripts/capture_screenshots.py
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-screenshots
          path: docs/screenshots/*.png
          if-no-files-found: error
      - name: Save screenshots to repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/screenshots/*.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh dashboard screenshots"
          git push origin HEAD:main
